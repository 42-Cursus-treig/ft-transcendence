<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Fond noir arcade -->
  <rect width="64" height="64" fill="#0a0a0f"/>

  <!-- Bordure phosphor cyan -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- Lettre T en pixels phosphor -->
  <rect x="14" y="16" width="36" height="6" fill="#39ff14"/>
  <rect x="29" y="22" width="6" height="26" fill="#39ff14"/>

  <!-- Petits points décoratifs (style scanline) -->
  <rect x="10" y="52" width="4" height="2" fill="#39ff14" opacity="0.6"/>
  <rect x="50" y="52" width="4" height="2" fill="#39ff14" opacity="0.6"/>
</svg>